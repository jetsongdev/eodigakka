[project]
name = "eodigakka-etl"
version = "0.1.0"
description = "Phase 1 RTMS ETL for eodigakka"
requires-python = ">=3.12"
dependencies = [
  "pandas>=2.2.0",
  "psycopg2-binary>=2.9.9",
  "PublicDataReader>=1.0.29",
  "python-dotenv>=1.0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
