# PR이 main에 merge되기 전(PR open/push/title 변경 시점)에 PR head에 chore(release):
# commit을 force-push로 미리 통합한다. 이러면 PR squash merge 시 main에 1 commit으로
# 모든 변경 + bump이 한 번에 들어가 Vercel rebuild 1회·Telegram 알림 1회·푸터 버전
# 즉시 갱신·Telegram CHANGELOG 본문 정확히 표시 모두 만족.
#
# 트리거 동작:
#   pull_request.opened/synchronize/reopened/edited (PR 진행 중) → prebump job
#   pull_request.closed (merged=true)                           → finalize job (tag만 push)
#
# bump 룰 (CLAUDE.md 「## 배포 워크플로」 참조):
#   feat:                                                 → minor
#   fix: / chore: / docs: / ci: / refactor: / perf: / test: / style: / build: → patch
#   PR body에 "BREAKING CHANGE"                           → major
#   매칭 안 됨                                              → patch (안전 fallback + ::warning)
#
# CHANGELOG [Unreleased] 없으면 prebump skip — release 의사 없는 PR(코멘트 정리 등)은
# 자연 skip되어 bump commit 추가 안 됨.
#
# 자기 트리거 회피: prebump의 force push는 GITHUB_TOKEN으로 → GitHub default로
# 워크플로 재트리거 안 함. 무한 loop 없음.
#
# 멱등성: 이미 PR head에 chore(release): commit이 있으면 reset HEAD~1으로 원본 복구 후
# 재계산. PR title 변경(edited 트리거)에도 안전.
#
# branch protection: prebump은 PR branch에만 push (main 영향 없음, GITHUB_TOKEN 충분).
# finalize의 tag push만 RELEASE_PAT 사용 (일관성 유지).

name: Version bump on PR (pre-merge)

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, closed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: '복구용: 처리할 PR 번호 (CHANGELOG에 [Unreleased]가 남아 있는 PR)'
        required: true
        type: string

permissions:
  contents: write
  pull-requests: read

jobs:
  prebump:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.pull_request.merged != true &&
        github.event.pull_request.base.ref == 'main' &&
        github.event.action != 'closed'
      )
    runs-on: ubuntu-latest

    steps:
      - name: PR 메타 (workflow_dispatch면 API로 조회)
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUM_INPUT: ${{ inputs.pr_number }}
          PR_TITLE_EVENT: ${{ github.event.pull_request.title }}
          PR_BODY_EVENT: ${{ github.event.pull_request.body }}
          PR_NUM_EVENT: ${{ github.event.pull_request.number }}
          PR_HEAD_REF_EVENT: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            PR_NUM="$PR_NUM_INPUT"
            if ! [[ "$PR_NUM" =~ ^[0-9]+$ ]]; then
              echo "::error::pr_number must be numeric, got: $PR_NUM"
              exit 1
            fi
            JSON=$(gh pr view "$PR_NUM" --json title,body,number,headRefName)
            HEAD_REF=$(echo "$JSON" | jq -r '.headRefName')
          else
            PR_NUM="$PR_NUM_EVENT"
            HEAD_REF="$PR_HEAD_REF_EVENT"
            JSON=$(jq -n \
              --arg t "$PR_TITLE_EVENT" \
              --arg b "$PR_BODY_EVENT" \
              --arg n "$PR_NUM" \
              '{title: $t, body: $b, number: ($n|tonumber)}')
          fi
          {
            echo "number=$PR_NUM"
            echo "head_ref=$HEAD_REF"
            echo "title<<EOF_TITLE"
            echo "$JSON" | jq -r '.title'
            echo "EOF_TITLE"
            echo "body<<EOF_BODY"
            echo "$JSON" | jq -r '.body // ""'
            echo "EOF_BODY"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.head_ref }}
          fetch-depth: 2
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: "기존 chore(release) commit이 있으면 reset (재계산 위해)"
        run: |
          set -euo pipefail
          LAST_MSG=$(git log -1 --format=%s)
          if printf '%s' "$LAST_MSG" | grep -qE '^chore\(release\):'; then
            echo "::notice::기존 chore(release): commit 발견 — reset HEAD~1로 원본 복구 후 재계산"
            git reset --hard HEAD~1
          fi

      - name: CHANGELOG [Unreleased] 확인 (없으면 skip)
        id: gate
        run: |
          set -euo pipefail
          if grep -qE '^## \[Unreleased\]' CHANGELOG.md; then
            echo "has_unreleased=true" >> "$GITHUB_OUTPUT"
            echo "::notice::CHANGELOG에 [Unreleased] 발견 — bump 진행"
          else
            echo "has_unreleased=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CHANGELOG에 [Unreleased] 없음 — prebump skip (release 의사 없는 PR)"
          fi

      - name: bump type 결정
        id: bump
        if: steps.gate.outputs.has_unreleased == 'true'
        env:
          PR_TITLE: ${{ steps.pr.outputs.title }}
          PR_BODY: ${{ steps.pr.outputs.body }}
        run: |
          set -euo pipefail
          if printf '%s' "$PR_BODY" | grep -qiE 'BREAKING[ -]?CHANGE'; then
            echo "type=major" >> "$GITHUB_OUTPUT"
            echo "::notice::bump=major (BREAKING CHANGE in PR body)"
            exit 0
          fi
          if printf '%s' "$PR_TITLE" | grep -qE '^feat(\([^)]+\))?:'; then
            echo "type=minor" >> "$GITHUB_OUTPUT"
            echo "::notice::bump=minor (feat: in title)"
            exit 0
          fi
          if printf '%s' "$PR_TITLE" | grep -qE '^(fix|chore|docs|ci|refactor|perf|test|style|build)(\([^)]+\))?:'; then
            echo "type=patch" >> "$GITHUB_OUTPUT"
            echo "::notice::bump=patch (recognized type in title)"
            exit 0
          fi
          echo "type=patch" >> "$GITHUB_OUTPUT"
          echo "::warning::PR title이 Conventional Commit 형식 미일치 — patch fallback. title=$PR_TITLE"

      - name: "web/package.json bump (main 기반 — 동시 PR 충돌 회피)"
        id: version
        if: steps.gate.outputs.has_unreleased == 'true'
        working-directory: web
        env:
          BUMP_TYPE: ${{ steps.bump.outputs.type }}
        run: |
          set -euo pipefail
          # PR head의 package.json이 아니라 main의 현재 version에서 bump.
          # 동시에 열린 두 PR이 같은 next version을 precompute해 충돌하는 회귀 방지.
          # (Codex P1: Recompute versions from main, not from the PR head)
          git fetch origin main --depth=1
          MAIN_VER=$(git show origin/main:web/package.json | python3 -c 'import json,sys; print(json.load(sys.stdin)["version"])')
          npm pkg set version="$MAIN_VER"
          npm version "$BUMP_TYPE" --no-git-tag-version
          NEW=$(node -p "require('./package.json').version")
          echo "new_version=$NEW" >> "$GITHUB_OUTPUT"
          echo "::notice::main v$MAIN_VER → v$NEW (bump=$BUMP_TYPE)"

      - name: CHANGELOG [Unreleased] → [vX.Y.Z] + KST 날짜 갱신
        if: steps.gate.outputs.has_unreleased == 'true'
        env:
          NEW_VERSION: ${{ steps.version.outputs.new_version }}
        run: |
          set -euo pipefail
          python3 <<'PY'
          import os, re, sys
          from datetime import datetime, timezone, timedelta
          version = os.environ["NEW_VERSION"]
          kst = timezone(timedelta(hours=9))
          today = datetime.now(kst).strftime("%Y-%m-%d")
          path = "CHANGELOG.md"
          text = open(path, encoding="utf-8").read()
          patterns = [
              (r"^## \[Unreleased\] - \d{4}-\d{2}-\d{2}( - .+)?$",
               lambda m: f"## [v{version}] - {today}{m.group(1) or ''}"),
              (r"^## \[Unreleased\]( - .+)?$",
               lambda m: f"## [v{version}] - {today}{m.group(1) or ''}"),
          ]
          for pat, repl in patterns:
              new_text, n = re.subn(pat, repl, text, count=1, flags=re.M)
              if n:
                  text = new_text
                  print(f"matched: {pat}")
                  break
          else:
              print("ERROR: gate가 [Unreleased] 발견했지만 어떤 정규식도 매칭 안 됨", file=sys.stderr)
              sys.exit(1)
          open(path, "w", encoding="utf-8").write(text)
          print(f"replaced [Unreleased] → [v{version}] - {today}")
          PY

      - name: "chore(release) commit + force-push to PR head"
        if: steps.gate.outputs.has_unreleased == 'true'
        env:
          NEW_VERSION: ${{ steps.version.outputs.new_version }}
          PR_NUM: ${{ steps.pr.outputs.number }}
          PR_HEAD_REF: ${{ steps.pr.outputs.head_ref }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/package.json CHANGELOG.md
          if git diff --cached --quiet; then
            echo "::warning::staged 변경 없음 — skip"
            exit 0
          fi
          git commit -m "chore(release): v$NEW_VERSION (PR #$PR_NUM)"
          git push --force-with-lease origin "HEAD:$PR_HEAD_REF"
          echo "::notice::pushed chore(release): v$NEW_VERSION → $PR_HEAD_REF"

  finalize:
    # PR merge 후 main의 latest commit에 tag만 push (Vercel rebuild 추가 안 일어남)
    if: |
      github.event_name == 'pull_request' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest

    steps:
      # main HEAD가 아니라 PR 머지 commit을 직접 checkout — 다른 PR이 그 사이 머지되어도
      # 우리 PR의 commit에 정확히 tag가 붙도록.
      # (Codex P1: Tag the merged PR commit instead of the moving main head)
      # fetch-tags: true로 원격 tag도 가져와 존재 검사가 정확히 작동.
      # (Codex P2: Fetch tags before checking whether v$V already exists)
      - name: "Checkout merged commit (main HEAD 아님 — race 회피) + fetch tags"
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          token: ${{ secrets.RELEASE_PAT }}
          fetch-depth: 1
          fetch-tags: true

      - name: package.json version 읽기
        id: ver
        working-directory: web
        run: |
          set -euo pipefail
          V=$(node -p "require('./package.json').version")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "::notice::merge commit의 web/package.json version: v$V"

      - name: tag vX.Y.Z 만들기 + push (이미 있으면 skip)
        env:
          V: ${{ steps.ver.outputs.version }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          set -euo pipefail
          # 원격 tag도 fetch됐으니 rev-parse가 정확함
          if git rev-parse "refs/tags/v$V" >/dev/null 2>&1; then
            echo "::notice::tag v$V 이미 존재 (원격 포함) — skip"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # explicit SHA로 tag — race 발생해도 우리 머지 commit에 정확히 붙음
          git tag "v$V" "$MERGE_SHA"
          git push origin "v$V"
          echo "::notice::pushed tag v$V → $MERGE_SHA"
